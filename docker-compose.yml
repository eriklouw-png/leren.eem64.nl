services:
  leren-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leren-web
    restart: unless-stopped
    networks:
      - websites
    ports:
      - "30182:80"
    volumes:
      - /mnt/POOL/WEBSITES/leren.eem64.nl:/var/www/html
    environment:
      AI_PROVIDER: "${AI_PROVIDER:-openai}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-6-luna}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

networks:
  websites:
    external: true
    name: websites
